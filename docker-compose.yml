# Ollama logging proxy — docker compose (shell). Pro TrueNAS Apps UI viz TrueNasAPP.yaml.
# Image nese jen toolchain; kód si kontejner naklonuje z Gitu do volume a při
# každém restartu udělá git pull (self-update).
services:
  ollama-proxy:
    image: ${APP_IMAGE:-ghcr.io/hulek-ales/ollamaproxy:latest}
    # Lokálně postavený image (docker build -t ghcr.io/hulek-ales/ollamaproxy:latest .): never
    pull_policy: ${APP_PULL_POLICY:-never}
    container_name: ollama-logging-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-11435}:11435"
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:-http://open-webui:11434}
      OLLAMA_LOG_DB: /data/ollama_log.db
      OLLAMA_LOG_BODIES: ${OLLAMA_LOG_BODIES:-1}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      REPO_URL: ${REPO_URL:-https://github.com/hulek-ales/OllamaProxy.git}
      REPO_BRANCH: ${REPO_BRANCH:-main}
    networks:
      - ollamaNet
    volumes:
      - proxy_data:/data
      - proxy_code:/app/src

networks:
  ollamaNet:
    name: ollamaNet
    external: true   # síť, na které už visí Open WebUI; chybí-li: docker network create ollamaNet

volumes:
  proxy_data:
    name: ollamaproxy_data
  proxy_code:
    name: ollamaproxy_code
